baseURL = 'http://8.134.185.227/'
locale = 'zh-cn'
title = '镜子的小窝UvU'
theme = 'PaperMod'

# 允许正文里的原始 HTML（表情包替换等依赖它）；
# hardWraps 让 Markdown 里的单个换行也渲染成 <br>，避免日记挤成一段。
[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[params]
  comments = true

# Giscus 配置。category 必须与 GitHub Discussions 里的分类名称一致；
# categoryID 从 Giscus 配置页复制，换分类时两者都要更新。
#[params.giscus]
#  repo = "mirror0r0/mirror0r0.github.io"
#  repoID = "R_kgDOVRzAig"
#  category = "General"
#  categoryID = "DIC_kwDOVRzAis4DJU1W"
#  categoryLabel = "关于网站"
#
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 让项目根目录的 deta2（头像、音乐、歌词）成为可访问的静态资源。
[module]
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'deta2'
    target = 'static/deta2'

# PaperMod 内置的标题图标：显示在站点标题左侧。
[params.label]
  icon = 'images/avatar.jpg'
  iconHeight = 40

[params.assets]
  theme_color = '#8AAEBD'
  msapplication_TileColor = '#8AAEBD'
