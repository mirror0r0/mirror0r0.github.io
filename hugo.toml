baseURL = 'http://8.134.185.227/'
locale = 'zh-cn'
title = '镜子的小窝UvU'
theme = 'PaperMod'

# 允许正文里的原始 HTML（表情包替换等依赖它）；
# hardWraps 让 Markdown 里的单个换行也渲染成 <br>，避免日记挤成一段。
[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true

[params]
  comments = true

# Giscus 配置。category 必须与 GitHub Discussions 里的分类名称一致；
# categoryID 从 Giscus 配置页复制，换分类时两者都要更新。
#[params.giscus]
#  repo = "mirror0r0/mirror0r0.github.io"
#  repoID = "R_kgDOVRzAig"
#  category = "General"
#  categoryID = "DIC_kwDOVRzAis4DJU1W"
#  categoryLabel = "关于网站"
#
[outputs]
  home = ["HTML", "RSS", "JSON"]

# meme/ 和 deta2/ 是体积很大的静态资源，不放进 Hugo 的 static 目录；
# 生产环境由 Nginx 直接 alias 到源目录（见 admin/deploy/nginx-studio.conf）。
[module]
  [[module.mounts]]
    source = 'static'
    target = 'static'
  # 注意：一旦自定义 module.mounts，Hugo 就不再自动挂载默认组件，
  # 必须显式恢复 assets，否则 assets/css 与 assets/js 会整体丢失（样式和脚本全没）。
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  # 上传图片额外挂进 assets：仅供图片渲染钩子读取宽高，RelPermalink 与原 URL 一致。
  [[module.mounts]]
    source = 'static/uploads'
    target = 'assets/uploads'

# PaperMod 内置的标题图标：显示在站点标题左侧。
[params.label]
  icon = 'images/avatar.jpg'
  iconHeight = 40

[params.assets]
  theme_color = '#8AAEBD'
  msapplication_TileColor = '#8AAEBD'
