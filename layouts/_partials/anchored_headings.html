{{- /* formats .Content headings by adding an anchor; meme markers are expanded first */ -}}
{{- $content := partial "meme-replace.html" . -}}
{{ $content | replaceRE
    "(<h[1-6] id=\"([^\"]+)\".+)(</h[1-6]+>)"
    "${1}<a hidden class=\"anchor\" aria-hidden=\"true\" href=\"#${2}\">#</a>${3}"
    | safeHTML
}}
