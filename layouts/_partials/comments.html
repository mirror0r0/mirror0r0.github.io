{{- if not (.Param "hideComments") }}
<section class="post-comments" id="isso-thread" aria-labelledby="comments-title">
    <header class="post-comments-head">
        <p class="post-comments-kicker">DISCUSSION</p>
        <h2 id="comments-title">评论</h2>
        <p>在下方留下想法，无需 GitHub 账号即可参与。</p>
    </header>
</section>
<script data-isso="/isso/"
        data-isso-lang="zh-CN"
        data-isso-reply-to-self="false"
        data-isso-require-author="false"
        data-isso-require-email="false"
        data-isso-avatar="true"
        data-isso-vote="true"
        src="/isso/js/embed.min.js"></script>
{{- end }}
