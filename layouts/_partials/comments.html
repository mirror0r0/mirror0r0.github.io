{{- if not (.Param "hideComments") }}
{{- $giscus := site.Params.giscus | default dict -}}
<section class="post-comments" id="comments" aria-labelledby="comments-title">
    <header class="post-comments-head">
        <p class="post-comments-kicker">DISCUSSION</p>
        <h2 id="comments-title">评论</h2>
        <p>在 GitHub Discussions 中留下想法，登录后即可参与。</p>
    </header>
    <div class="giscus"></div>
    <script src="https://giscus.app/client.js"
        data-repo="{{ $giscus.repo | default "mirror0r0/mirror0r0.github.io" }}"
        data-repo-id="{{ $giscus.repoID | default "R_kgDOVRzAig" }}"
        data-category="{{ $giscus.category | default "General" }}"
        data-category-id="{{ $giscus.categoryID | default "DIC_kwDOVRzAis4DJU1W" }}"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="1"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
    </script>
</section>
{{- end }}
