{{- if .Content }}
<div class="post-engagement" data-post-metrics data-metrics-path="{{ .RelPermalink }}">
    <span class="post-engagement-stat" title="Giscus 爱心">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>
        </svg>
        <span data-metric="likes">0</span>
    </span>
    <span class="post-engagement-stat" title="本机浏览量">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span data-metric="views">0</span>
    </span>
    <span class="post-engagement-stat" title="评论">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a4 4 0 0 1-4 4H8l-6 4V7a4 4 0 0 1 4-4h11a4 4 0 0 1 4 4Z"/></svg>
        <span data-metric="comments">0</span>
    </span>
    <a class="post-engagement-link" href="#comments">在评论区留下爱心</a>
</div>
{{- end }}
